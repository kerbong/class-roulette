name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 연달아 push해도 마지막 것만 올라간다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # public-url이 './'라 저장소 이름이 무엇이든 하위 경로에서 그대로 열린다
      - run: npm run build

      # 저장소 Settings > Pages > Source가 'GitHub Actions'로 되어 있어야 한다.
      # enablement로 자동으로 켜려 해봤지만 워크플로 토큰 권한으로는 실패해서 수동 설정으로 둔다
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
